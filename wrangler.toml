name = "nosmokingareanew"
main = "src/index.js"
compatibility_date = "2026-11-21"

[triggers]
crons = ["0 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nosmokingarea-db"
database_id = "c05b7a06-eaef-4416-92fd-1ee4e66ef3e9"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
